people:
  - name: Sanghack Lee
    url: https://www.sanghacklee.me
    role: Professor, Seoul National University
    message: >
      I spent a year in Professor Lee's lab working on causal machine learning, and it was one of the most
      formative experiences of my academic life. His patience in guiding a student who came in knowing very
      little, and his genuine investment in how I think rather than just what I produce, shaped the way I
      approach research problems. I am deeply grateful.

  - name: Jaewon Choi
    url: https://sites.google.com/site/jaewchoi1203
    role: Professor, Seoul National University
    message: >
      Over two years, Professor Choi guided me through my work on ATM offerings with remarkable generosity
      and rigor. He taught me how to build an argument from the data up, and how to ask the kinds of
      questions that are worth asking. The hidden costs project would not exist without his mentorship.

  - name: Changwhan Yea
    url: https://www.linkedin.com/in/changwhanyea/
    role: Kasa Singapore
    message: >
      Changwhan taught me things I did not expect to learn at work. Beyond markets and investing, he shared
      how he thought about challenges, setbacks, and what actually matters. That kind of mentorship is hard
      to find, and I am grateful I got it early.

  - name: Soyeon Park
    url:
    role: Meritz Securities
    message: >
      Soyeon was my supervisor at Meritz, and she was genuinely warm. She walked me through how macro and
      banking actually work, and talked to me about life too. At some point I realized she was treating me
      as a real mentee, not just an intern. That meant a lot.

  - name: David Schoenherr
    url: https://sites.google.com/site/davidschoenherr
    role: Professor, Seoul National University
    message: >
      Professor Schoenherr showed me what it actually means to care about research. He gave me genuine
      support not just through the graduate school application, but through the academic path that followed.
      He was always introducing me to the right people and opening doors I did not know existed. And watching
      how excited he gets about research, that kind of passion is contagious. I am grateful for everything
      he did for me.
